services:
  mysql-db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-network]
  user-service:
    build: .
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthProbe"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [app-network]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
    ports: ["3000:3000"]
    networks: [app-network]
volumes:
  mysql_prod_data:
networks:
  app-network:
    driver: bridge
