name: CI
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew --no-daemon test
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Verify UI, health and persisted CRUD
        run: |
          set -e
          curl --retry 40 --retry-delay 3 --retry-connrefused --fail http://localhost:3000/
          curl --fail http://localhost:3000/users
          curl --fail http://localhost:8080/actuator/health
          created=$(curl --fail --silent -X POST http://localhost:3000/users -H 'Content-Type: application/json' -d '{"name":"Smoke","email":"smoke@example.com","phone":"555-1234","address":"CI Street"}')
          echo "$created" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["phone"] == "555-1234" and d["address"] == "CI Street"'
          id=$(echo "$created" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          curl --fail --silent "http://localhost:3000/users/$id" | python3 -c 'import sys,json; assert json.load(sys.stdin)["phone"] == "555-1234"'
          curl --fail --silent -X PUT "http://localhost:3000/users/$id" -H 'Content-Type: application/json' -d '{"name":"Smoke","email":"smoke@example.com","phone":"555-5678","address":"Updated Street"}' | python3 -c 'import sys,json; assert json.load(sys.stdin)["address"] == "Updated Street"'
          curl --fail -X DELETE "http://localhost:3000/users/$id"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/users/$id")" = "404"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
