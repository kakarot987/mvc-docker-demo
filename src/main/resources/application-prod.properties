# ==================== PRODUCTION ENVIRONMENT CONFIGURATION ====================
# Profile: prod
# Activated by: SPRING_PROFILES_ACTIVE=prod
# Database credentials should be provided via environment variables

# Database Configuration (from Docker environment variables)
spring.datasource.url=jdbc:mysql://mysql-db:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA/Hibernate Configuration (strict mode for production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration (minimal for production)
logging.level.root=WARN
logging.level.com.mvc_docker=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Server Configuration
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator (minimal exposure for security)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Production optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

