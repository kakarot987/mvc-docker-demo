# ==================== DEVELOPMENT ENVIRONMENT CONFIGURATION ====================
# Profile: dev
# Activated by: SPRING_PROFILES_ACTIVE=dev

# Database Configuration (local docker-compose)
spring.datasource.url=jdbc:mysql://mysql-db:3306/userdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=userpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration (verbose for development)
logging.level.root=INFO
logging.level.com.mvc_docker=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=always

# Actuator (health and metrics)
management.endpoints.web.exposure.include=health,metrics,env
management.endpoint.health.show-details=always

