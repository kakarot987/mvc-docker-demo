
# ==================== DEVELOPMENT ENVIRONMENT ====================
# Run: docker-compose up -d
# This compose file is for local development with debug logging and easy restarts

services:
  mysql-db:
    image: mysql:8
    container_name: mvc-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: userdb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.mvc-docker.environment=development"

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvc-app-dev
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/userdb?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: userpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    networks:
      - app-network
    labels:
      - "com.mvc-docker.environment=development"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "/users"
    container_name: mvc-ui-dev
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - REACT_APP_API_URL=/users
    labels:
      - "com.mvc-docker.environment=development"

volumes:
  mysql_dev_data:
    driver: local

networks:
  app-network:
    driver: bridge
