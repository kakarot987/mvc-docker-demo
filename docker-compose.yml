services:
  mysql-db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: userdb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-network]
  user-service:
    build: .
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/userdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: userpassword
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthProbe"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [app-network]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
    ports: ["3000:3000"]
    networks: [app-network]
volumes:
  mysql_dev_data:
networks:
  app-network:
    driver: bridge
